<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">BotCraft — featured LINE Bot project</title>
  <desc id="desc">A featured project card showing BotCraft's visual flow builder, RAG system, analytics, and production stack.</desc>

  <defs>
    <linearGradient id="projectBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="project-start" />
      <stop offset="1" class="project-end" />
    </linearGradient>
    <linearGradient id="projectAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06c755" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" class="dot" />
    </pattern>
    <filter id="projectGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    .project-start { stop-color: #07140d; }
    .project-end { stop-color: #0f172a; }
    .dot { fill: #5eead4; fill-opacity: .07; }
    .frame { fill: none; stroke: #214232; }
    .main { fill: #f8fafc; }
    .soft { fill: #cbd5e1; }
    .muted { fill: #94a3b8; }
    .chip { fill: #0f2119; stroke: #27523b; }
    .flow-card { fill: #0e1c18; stroke: #27523b; }
    .flow-line { fill: none; stroke: #3d6b52; stroke-width: 2; stroke-dasharray: 5 7; animation: move 9s linear infinite; }
    .ping { animation: ping 2.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    @keyframes move { to { stroke-dashoffset: -96; } }
    @keyframes ping { 0% { opacity: 1; transform: scale(.5); } 75%, 100% { opacity: 0; transform: scale(2.2); } }

    @media (prefers-color-scheme: light) {
      .project-start { stop-color: #f0fdf4; }
      .project-end { stop-color: #f8fafc; }
      .dot { fill: #0f766e; fill-opacity: .08; }
      .frame { stroke: #bbf7d0; }
      .main { fill: #0f172a; }
      .soft { fill: #334155; }
      .muted { fill: #64748b; }
      .chip { fill: #ffffff; stroke: #bbf7d0; }
      .flow-card { fill: #ffffff; stroke: #bbf7d0; }
      .flow-line { stroke: #86b89a; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-line, .ping { animation: none; }
    }
  </style>

  <rect width="1200" height="300" rx="24" fill="url(#projectBg)" />
  <rect width="1200" height="300" rx="24" fill="url(#dots)" />
  <rect x="1" y="1" width="1198" height="298" rx="23" class="frame" />

  <g transform="translate(56 44)">
    <text fill="#22c55e" font-size="12" font-weight="700" letter-spacing="2.4">FEATURED BUILD // 01</text>
    <text y="55" class="main" font-size="41" font-weight="750" letter-spacing="-1">BOTCRAFT</text>
    <text y="86" class="soft" font-size="16">A visual operating system for LINE Bot teams.</text>
    <text y="116" class="muted" font-size="13">Visual flow builder · RAG knowledge base · Realtime analytics</text>

    <g transform="translate(0 146)">
      <rect class="chip" width="142" height="34" rx="17" />
      <text x="71" y="22" class="soft" font-size="10" text-anchor="middle">REACT + TYPESCRIPT</text>
      <rect class="chip" x="152" width="132" height="34" rx="17" />
      <text x="218" y="22" class="soft" font-size="10" text-anchor="middle">FASTAPI + PYTHON</text>
      <rect class="chip" x="294" width="154" height="34" rx="17" />
      <text x="371" y="22" class="soft" font-size="10" text-anchor="middle">POSTGRESQL + REDIS</text>
    </g>

    <g transform="translate(0 205)">
      <rect width="184" height="2" rx="1" fill="url(#projectAccent)" />
      <text x="201" y="6" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="1.5">OPEN REPOSITORY ↗</text>
    </g>
  </g>

  <g transform="translate(624 42)">
    <rect class="flow-card" width="520" height="216" rx="20" />
    <text x="26" y="31" class="muted" font-size="10" letter-spacing="1.8">MESSAGE PIPELINE / LIVE</text>
    <circle cx="486" cy="27" r="5" fill="#22c55e" />
    <circle class="ping" cx="486" cy="27" r="8" fill="none" stroke="#22c55e" />

    <path class="flow-line" d="M80 105H158M236 105H314M392 105H448" />

    <g transform="translate(26 70)">
      <rect class="chip" width="108" height="70" rx="14" />
      <path d="M24 20h30a8 8 0 018 8v12a8 8 0 01-8 8H41l-9 8v-8h-8a8 8 0 01-8-8V28a8 8 0 018-8z" fill="#06c755" fill-opacity=".13" stroke="#06c755" />
      <text x="79" y="34" class="main" font-size="11" text-anchor="middle">LINE</text>
      <text x="79" y="50" class="muted" font-size="8" text-anchor="middle">MESSAGE</text>
    </g>

    <g transform="translate(158 70)">
      <rect class="chip" width="108" height="70" rx="14" />
      <circle cx="31" cy="35" r="13" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" />
      <path d="M25 35h12M31 29v12" stroke="#5eead4" stroke-width="2" stroke-linecap="round" />
      <text x="77" y="34" class="main" font-size="11" text-anchor="middle">FLOW</text>
      <text x="77" y="50" class="muted" font-size="8" text-anchor="middle">BUILDER</text>
    </g>

    <g transform="translate(290 70)">
      <rect class="chip" width="108" height="70" rx="14" />
      <circle cx="31" cy="35" r="13" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" />
      <path d="M24 38c5-10 10-10 15 0M26 30h10" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" />
      <text x="77" y="34" class="main" font-size="11" text-anchor="middle">AI</text>
      <text x="77" y="50" class="muted" font-size="8" text-anchor="middle">RAG</text>
    </g>

    <g transform="translate(422 70)">
      <rect class="chip" width="72" height="70" rx="14" />
      <circle cx="36" cy="28" r="12" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" />
      <path d="M30 28l4 4 8-9" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="55" class="main" font-size="9" text-anchor="middle">REPLY</text>
    </g>

    <g transform="translate(26 166)">
      <rect x="0" width="468" height="26" rx="8" fill="#22c55e" fill-opacity=".07" stroke="#22c55e" stroke-opacity=".18" />
      <text x="14" y="17" fill="#4ade80" font-size="9">WEBHOOK ✓</text>
      <text x="109" y="17" class="muted" font-size="9">AUTH ✓</text>
      <text x="179" y="17" class="muted" font-size="9">KNOWLEDGE ✓</text>
      <text x="287" y="17" class="muted" font-size="9">ANALYTICS ✓</text>
      <text x="390" y="17" class="muted" font-size="9">DOCKER ✓</text>
    </g>
  </g>
</svg>
